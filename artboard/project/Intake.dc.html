<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set-up: your mouth</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0;font-family:'DM Sans',Arial,sans-serif}
.app{--bg:#EEF1F0;--tile:#FFFFFF;--ink:#101C25;--mute:#5E6E77;--line:#DDE4E3;--blue:#3547D9;--blue-soft:#E3E7FD;--sh:0 1px 0 rgba(255,255,255,.9) inset,0 10px 24px -16px rgba(16,28,37,.32);--r:24px}
.app.night{--bg:#0B1218;--tile:#16212B;--ink:#EAF0F0;--mute:#8CA0AA;--line:#223340;--blue:#9AA7FF;--blue-soft:#222C63;--sh:0 10px 24px -16px rgba(0,0,0,.6)}
.app.r16{--r:16px}.app.r32{--r:32px}
.app{box-sizing:border-box;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.35;position:relative;overflow:hidden}
.k{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.h{font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:700;letter-spacing:-.025em;line-height:1.05}
.pick{display:flex;flex-direction:column;gap:12px;min-height:104px;box-sizing:border-box;padding:16px;border-radius:var(--r);background:var(--tile);box-shadow:var(--sh);border:2px solid transparent;color:var(--ink);font:700 15px 'DM Sans',Arial,sans-serif;text-align:left;cursor:pointer}
.pick svg{color:var(--blue)}
.pick.on{border-color:var(--blue);background:var(--blue-soft)}
/* Palette v2: Headspace-inspired. */
.app{--bg:#F9F4F2;--tile:#FFFFFF;--ink:#2D2C2B;--mute:#68625D;--line:#EBDFD9;--blue:#0061EF;--blue-soft:#E3EDFD;--sh:0 1px 0 rgba(255,255,255,.9) inset,0 10px 24px -16px rgba(90,50,30,.3)}
.app.night{--bg:#16132B;--tile:#221E3F;--ink:#F6F1EE;--mute:#B1A9C9;--line:#352F5C;--blue:#7FB0FF;--blue-soft:#1E3566;--sh:0 10px 24px -16px rgba(0,0,0,.6)}
/* Palette v3 (supersedes v2). */
.app{--bg:#FFFFFF;--tile:#F9F4F2;--ink:#2D2C2B;--mute:#63605D;--line:#E9DDD7;--blue:#0061EF;--blue-soft:#E1ECFD;--sh:none}
.app.night{--bg:#1B1740;--tile:#2B2560;--ink:#FFFFFF;--mute:#C2BBE6;--line:#40398A;--blue:#8DB9FF;--blue-soft:#2A3F7E;--sh:none}
.h{font-family:'DM Sans',Arial,sans-serif;font-weight:700;letter-spacing:-.02em}
.k{font-family:'DM Sans',Arial,sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em}
</style>
</helmet>
<div class="app {{modeClass}}" style="width: 390px; height: 844px; padding: 62px 14px 34px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; gap: 5px; padding: 0 4px"><span style="flex: 1; height: 4px; border-radius: 2px; background: var(--blue)"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: var(--blue)"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: var(--line)"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: var(--line)"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: var(--line)"></span></div>

<div style="padding: 0 4px">
<div class="k">Step 2 of 5 · About your mouth</div>
<div class="h" style="font-size: 30px; margin-top: 8px">What's in your mouth that isn't a natural tooth?</div>
<div style="font-size: 14px; color: var(--mute); margin-top: 8px">Select all that apply. Not sure? Skip it and ask your dentist later.</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button class="pick on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4C4 4 3 7 4 10s1 10 4 10c2 0 1-5 4-5s2 5 4 5c3 0 3-7 4-10s0-6-3-6c-2 0-3 1-5 1S9 4 7 4z"/></svg>Implant</button>
<button class="pick"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9c0-4 14-4 14 0v2c0 5-3 9-7 9s-7-4-7-9z"/></svg>Crown</button>
<button class="pick"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18M6 8v8M12 8v8M18 8v8"/></svg>Bridge</button>
<button class="pick"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="3"/><path d="M8 8v8M16 8v8"/></svg>Braces or aligners</button>
<button class="pick"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9c0-3 16-3 16 0 0 4-3 8-8 8s-8-4-8-8z"/></svg>Dentures</button>
<button class="pick"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M8 12h8"/></svg>None of these</button>
</div>

<div style="margin-top: auto; display: grid; gap: 8px">
<button style="min-height: 54px; border: 0; border-radius: 20px; background: var(--ink); color: var(--bg); font: 700 16px 'DM Sans', Arial, sans-serif; cursor: pointer">Continue</button>
<button style="min-height: 44px; border: 0; background: transparent; color: var(--mute); font: 700 14px 'DM Sans', Arial, sans-serif; cursor: pointer">Skip for now</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"night":{"editor":"boolean","default":false},"radius":{"editor":"enum","default":"24","options":["16","24","32"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const night = this.props.night ?? false;
const r = this.props.radius ?? '24';
return { modeClass: (night ? 'night' : 'day') + ' r' + r };
}
}
</script>
</body>
</html>
